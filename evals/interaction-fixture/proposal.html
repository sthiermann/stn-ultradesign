<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThermoDesk candidate</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui;color:#17212b;background:#f5f7fa}button,select,input{font:inherit}button,select{padding:8px 12px;background:white;border:1px solid #bac7d2;border-radius:9px;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #1266cc;outline-offset:2px}header,nav,main{padding:16px}header{display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #d6dfe5}nav{display:flex;gap:8px}main{max-width:1200px;margin:auto}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.tile{min-height:220px;padding:18px;background:white;border:1px solid #d6dfe5;border-radius:16px}.muted{color:#566575}.stat{font-size:27px;margin-top:36px}svg{width:100%;height:48px}aside{position:fixed;inset:auto 16px 16px auto;width:min(360px,calc(100% - 32px));height:310px;border:1px solid #bdcbd6;border-radius:16px;background:white;box-shadow:0 16px 40px #16223522;padding:16px}aside.expanded{inset:65px 16px 16px;width:auto;height:auto}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}dialog{margin:0 0 0 auto;border:0;border-left:1px solid #bdcbd6;height:100dvh;max-height:100dvh;width:min(480px,100%);padding:20px}dialog::backdrop{background:#17212b44}.sheet-actions{display:grid;gap:10px;margin-top:20px}.sheet-actions button{text-align:left}label{display:block;margin:15px 0}input:not([type=checkbox]){width:100%;padding:8px}#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;background:#243f55;color:white;z-index:8}[hidden]{display:none!important}@media(max-width:700px){.tiles{grid-template-columns:1fr}.tile{min-height:150px}}
</style>
<header><strong>ThermoDesk</strong><button id="messages">Messages</button></header>
<nav><button id="monitor">Monitoring</button><button id="roles">Roles</button></nav>
<main id="workspace"></main>
<aside id="messenger" hidden><div class="row"><strong>Messages</strong><button id="expand">Expand</button><button id="close-messenger" aria-label="Close messages">×</button></div><p>Alex Morgan</p><p class="muted">The afternoon check is complete.</p><button id="new-conversation">New conversation</button><label>Message<input id="draft"></label><button id="send">Send</button></aside>
<dialog id="sheet"><div class="row"><h2 id="sheet-title"></h2><button id="close-sheet" aria-label="Close panel">×</button></div><div id="sheet-content"></div></dialog>
<div id="toast" role="status" hidden></div>
<script>
const workspace=document.querySelector('#workspace'),sheet=document.querySelector('#sheet'),content=document.querySelector('#sheet-content');
let toastTimer;
function notice(message){const toast=document.querySelector('#toast');toast.textContent=message;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,4000)}
function panel(title,html){document.querySelector('#sheet-title').textContent=title;content.innerHTML=html;if(!sheet.open)sheet.showModal()}
function actions(items){return '<div class="sheet-actions">'+items.map(([id,label])=>`<button data-action="${id}">${label}</button>`).join('')+'</div>'}
function monitoring(){workspace.innerHTML='<div class="toolbar"><button data-action="views">North lab ▾</button><button data-action="more">More actions</button><button data-action="display">Display</button><button data-action="statistics">Statistics</button><button data-action="events">Play event burst</button></div><div class="tiles">'+['A','B','C'].map(c=>`<article class="tile"><strong>Chamber ${c}</strong><div class="stat">28.2 °C</div><div class="muted">Temperature · Normal</div><svg viewBox="0 0 200 40" aria-label="Temperature history"><path d="M0 30 L30 20 L60 25 L90 15 L120 20 L150 9 L180 12 L200 5" stroke="#1769bd" fill="none" stroke-width="2"/></svg><button data-action="threshold">Edit threshold</button></article>`).join('')+'</div>'}
function run(action){
 if(action==='more')panel('More actions',actions([['refresh-options','Refresh readings'],['copy-options','Copy view link'],['rename','Rename view'],['reset-options','Reset arrangement']]));
 if(action==='refresh-options')panel('Refresh readings',actions([['refresh','Refresh now']]));
 if(action==='refresh'){notice('Readings refreshed');sheet.close()}
 if(action==='copy-options')panel('Share view',actions([['copy','Copy link']]));
 if(action==='copy'){notice('Link copied');sheet.close()}
 if(action==='reset-options')panel('Arrangement',actions([['reset','Reset now']]));
 if(action==='reset'){notice('Arrangement reset');sheet.close()}
 if(action==='rename')panel('Rename view','<label>Name<input value="North lab"></label>'+actions([['save','Save'],['cancel','Cancel']]));
 if(action==='views')panel('Views',actions([['view','North lab'],['view','Stability tests'],['view','Evening run']]));
 if(action==='view'){notice('View selected');sheet.close()}
 if(action==='display')panel('Display',actions([['details','Detail options']]));
 if(action==='details')panel('Detail options','<label><input type="checkbox" checked> Show details</label><p class="muted">Names, symbols and previews follow this setting.</p>');
 if(action==='statistics')panel('Statistics','<p class="stat">84.6 °C</p><p>Combined temperature</p><button data-action="monitor-return">Return to monitoring</button>');
 if(action==='monitor-return')sheet.close();
 if(action==='threshold')panel('Temperature threshold','<label>Upper limit (°C)<input value="30.0" type="number"></label>'+actions([['save','Save'],['cancel','Cancel']]));
 if(action==='save'){notice('Saved');sheet.close()}
 if(action==='cancel')sheet.close();
 if(action==='events'){['Chamber A · 30.4 °C','Chamber B · 31.1 °C','Chamber C · 30.0 °C','Chamber A · 30.6 °C'].forEach((s,i)=>setTimeout(()=>notice(s),i*350))}
 if(action==='new')panel('New conversation','<label>Recipient<select><option>Alex Morgan</option><option>Sam Chen</option></select></label><label>Message<input id="new-draft"></label>'+actions([['start','Start conversation']]));
 if(action==='start'){notice('Conversation started');sheet.close()}
 if(action==='edit-role')panel('Role','<label>Name<input value="Manage"></label><label><input type="checkbox" checked> Read</label><label><input type="checkbox" checked> Act</label><label><input type="checkbox" checked> Manage</label>'+actions([['save','Save']]));
}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button)run(button.dataset.action)});
document.querySelector('#close-sheet').onclick=()=>sheet.close();
document.querySelector('#monitor').onclick=monitoring;
document.querySelector('#roles').onclick=()=>workspace.innerHTML='<h1>Roles</h1><p>Choose access level for your team.</p>'+actions([['edit-role','Read'],['edit-role','Act'],['edit-role','Manage']]);
document.querySelector('#messages').onclick=()=>document.querySelector('#messenger').hidden=false;
document.querySelector('#close-messenger').onclick=()=>document.querySelector('#messenger').hidden=true;
document.querySelector('#expand').onclick=()=>document.querySelector('#messenger').classList.toggle('expanded');
document.querySelector('#new-conversation').onclick=()=>run('new');
document.querySelector('#send').onclick=()=>{document.querySelector('#draft').value='';notice('Sent')};
monitoring();
</script></html>
