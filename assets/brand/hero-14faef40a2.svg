    <text x="56" y="210" fill="#f4f3ee" font-size="76" font-weight="700" letter-spacing="-3.3">Design the</text>
    <text x="56" y="296" fill="#f4f3ee" font-size="76" font-weight="700" letter-spacing="-3.3">whole experience.</text>
    <path d="M59 326H132" stroke="#dfbd62" stroke-width="4"/>
    <text x="58" y="373" fill="#c1cbd1" font-size="24">A deliberate system.</text>
    <text x="58" y="408" fill="#c1cbd1" font-size="24">From the first screen to the final state.</text>
