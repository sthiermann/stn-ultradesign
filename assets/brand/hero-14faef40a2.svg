<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">STN Ultradesign — Design the whole experience</title>
  <desc id="desc">An original editorial illustration in dark slate and signal gold. A bold product statement sits beside an abstract composition of desktop, tablet and phone frames. It represents coherent structure across different surfaces, not a screenshot or a measured product outcome.</desc>
