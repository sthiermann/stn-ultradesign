<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740" role="img" aria-labelledby="title desc">
<title id="title">The STN Ultradesign delivery workflow</title>
<desc id="desc">Requirements, creative direction, system and components, complete concept, independent review, human acceptance, implementation, verification. Review findings inform revision. Acceptance covers a specific revision and scope; verification checks the implemented result.</desc>
