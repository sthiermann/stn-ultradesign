<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" role="img" aria-labelledby="title desc">
  <title id="title">The STN Ultradesign method</title>
  <desc id="desc">Audit, Concept, Approve, Implement, Verify. Evidence informs a product-specific concept. Review and refine it with the user before implementation. Verify the result; new findings inform the next decision.</desc>
