    <g fill="#f4f3ee" font-size="35" font-weight="700" letter-spacing="-.8">
      <text x="36" y="103">Make decisions visible.</text>
      <text x="36" y="147">Carry them through.</text>
    </g>
    <path d="M36 178H604" stroke="#34424d"/>
    <path d="M62 223V833" stroke="#536973" stroke-width="2"/>
